<!DOCTYPE html>
<html lang="ru" data-theme="day">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fa">
    <title>FreshTracker</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/themes.css">
    <script src="assets/theme.js"></script>
</head>
<body>
<div class="app" id="app" hidden>
    <header class="header">
        <div class="header__inner">
            <div class="brand">
                <span class="brand__mark" aria-hidden="true">🍎</span>
                <h1 class="brand__title">FreshTracker</h1>
            </div>
            <div class="header__actions">
                <button class="icon-btn" id="btnUnlock" type="button" title="Ввести пароль" aria-label="Ввести пароль" hidden>
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-7h-1V7a5 5 0 0 0-10 0v3H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zM9 7a3 3 0 0 1 6 0v3H9V7z"/></svg>
                </button>
                <button class="icon-btn" id="btnRefresh" type="button" title="Обновить" aria-label="Обновить">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17.6 6.4A8 8 0 1 0 19.7 14h-2.1a6 6 0 1 1-1.5-6.2L13 11h7V4l-2.4 2.4z"/></svg>
                </button>
                <button class="icon-btn" id="btnTheme" type="button" title="Переключить тему" aria-label="Переключить тему">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2a1 1 0 0 0 0-2H2a1 1 0 0 0 0 2zm18 0h2a1 1 0 0 0 0-2h-2a1 1 0 0 0 0 2zM11 2v2a1 1 0 0 0 2 0V2a1 1 0 0 0-2 0zm0 18v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-2 0zM5.99 4.58a1 1 0 1 0-1.41 1.41l1.06 1.06A1 1 0 0 0 7.05 5.64L5.99 4.58zm12.37 12.37a1 1 0 1 0-1.41 1.41l1.06 1.06a1 1 0 0 0 1.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 1 0-1.41-1.41l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 1 0-1.41-1.41l-1.06 1.06a1 1 0 1 0 1.41 1.41l1.06-1.06z"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 8.9 10.4A7 7 0 0 1 12 3z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="summary" id="summary" aria-label="Сводка"></section>

        <div class="viewbar">
            <nav class="tabs" role="tablist" aria-label="Разделы">
                <button class="tabs__btn is-active" type="button" role="tab" data-view="active" aria-selected="true">Продукты</button>
                <button class="tabs__btn" type="button" role="tab" data-view="history" aria-selected="false">История</button>
            </nav>
            <button class="btn btn--primary add-btn" id="btnAdd" type="button" aria-label="Добавить продукт">
                <span class="add-btn__icon" aria-hidden="true">+</span><span class="add-btn__text">Добавить</span>
            </button>
        </div>

        <section class="view" id="viewActive">
            <div class="toolbar">
                <div class="search">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
                    <input id="search" type="search" placeholder="Найти продукт" autocomplete="off" aria-label="Поиск продукта">
                </div>
                <div class="chips" id="typeFilter" role="group" aria-label="Фильтр по типу"></div>
            </div>
            <div class="list" id="productsList" aria-live="polite"></div>
        </section>

        <section class="view" id="viewHistory" hidden>
            <div class="stats" id="historyStats"></div>
            <div class="list" id="historyList" aria-live="polite"></div>
        </section>
    </main>

</div>

<div class="blocked" id="blocked" hidden>
    <div class="blocked__card">
        <span class="blocked__icon" aria-hidden="true">🔒</span>
        <h2>Доступ закрыт</h2>
        <p>Этот адрес не входит в разрешённые сети.</p>
    </div>
</div>

<div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close-sheet></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header class="sheet__header">
            <h2 id="sheetTitle">Новый продукт</h2>
            <button class="icon-btn" type="button" data-close-sheet aria-label="Закрыть">✕</button>
        </header>

        <form id="productForm" class="form" novalidate>
            <input type="hidden" id="productId" value="">

            <label class="field">
                <span class="field__label">Название</span>
                <input class="input" id="name" name="name" required maxlength="255" autocomplete="off" placeholder="Гречневая крупа">
            </label>

            <div class="field">
                <span class="field__label">Тип</span>
                <div class="chips" id="typeChips" role="group" aria-label="Тип продукта"></div>
            </div>

            <div class="field-row">
                <label class="field">
                    <span class="field__label">Количество</span>
                    <div class="input-group">
                        <input class="input" id="weight" name="weight" type="number" min="1" step="1" inputmode="decimal" required>
                        <select class="input input--unit" id="weightUnit" name="weight_unit" aria-label="Единица веса">
                            <option value="g">г</option>
                            <option value="kg">кг</option>
                        </select>
                    </div>
                </label>
                <label class="field">
                    <span class="field__label">Срок годности</span>
                    <input class="input" id="expiryDate" name="expiry_date" type="date" required>
                </label>
            </div>

            <div class="quick" id="quickExpiry">
                <button type="button" class="quick__btn" data-days="3">+3 дня</button>
                <button type="button" class="quick__btn" data-days="7">+7</button>
                <button type="button" class="quick__btn" data-days="14">+14</button>
                <button type="button" class="quick__btn" data-days="30">+30</button>
                <button type="button" class="quick__btn" data-days="180">+180</button>
                <button type="button" class="quick__btn" data-type-expiry>По типу</button>
            </div>

            <details class="advanced">
                <summary>Дополнительно</summary>
                <label class="field">
                    <span class="field__label">Порог предупреждения, дней</span>
                    <input class="input" id="threshold" name="threshold_days" type="number" min="1" max="365" value="7">
                </label>
            </details>

            <p class="form__error" id="formError" hidden></p>

            <div class="form__actions">
                <button class="btn btn--ghost" type="button" data-close-sheet>Отмена</button>
                <button class="btn btn--primary" type="submit" id="submitBtn">Добавить</button>
            </div>
        </form>
    </div>
</div>

<div class="modal" id="login" hidden>
    <div class="modal__backdrop" data-close-login></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <h2 id="loginTitle">Режим редактирования</h2>
        <p class="modal__hint">Введите пароль, чтобы добавлять и изменять продукты.</p>
        <form id="loginForm" class="form" novalidate>
            <label class="field">
                <span class="field__label">Пароль</span>
                <input class="input" id="password" type="password" autocomplete="current-password" required>
            </label>
            <p class="form__error" id="loginError" hidden></p>
            <div class="form__actions">
                <button class="btn btn--ghost" type="button" data-close-login>Отмена</button>
                <button class="btn btn--primary" type="submit">Войти</button>
            </div>
        </form>
    </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
